name: Deploy static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run tests
        run: npm test

      - name: Generate Firebase config
        run: |
          cat <<EOF > config.js
          window.__firebase_config = ${FIREBASE_CONFIG_JSON:-{}};
          window.__app_id = "${APP_ID:-default-gradebook-app}";
          window.__initial_auth_token = "${CUSTOM_AUTH_TOKEN}";
          EOF
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          APP_ID: ${{ secrets.APP_ID }}
          CUSTOM_AUTH_TOKEN: ${{ secrets.CUSTOM_AUTH_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
